<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <title>Unavailable</title>
        <style>
            :root {
                color-scheme: light;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f3f0e9;
                color: #29251f;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 2rem;
            }

            main {
                width: min(100%, 42rem);
                border: 1px solid #d8d0c2;
                border-radius: 0.75rem;
                background: #fff;
                padding: clamp(2rem, 6vw, 4rem);
                box-shadow: 0 1rem 3rem rgb(62 50 34 / 10%);
            }

            h1 {
                margin: 0 0 1rem;
                font-family: Georgia, "Times New Roman", serif;
                font-size: clamp(2rem, 7vw, 3.25rem);
                line-height: 1.05;
            }

            p {
                margin: 0.8rem 0;
                font-size: 1.05rem;
                line-height: 1.65;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Unavailable</h1>
            <p>This login location is no longer available.</p>
        </main>
    </body>
</html>
